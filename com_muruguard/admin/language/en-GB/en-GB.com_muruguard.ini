COM_MURUGUARD_HARDENING_TITLE="MuRu Shield Hardening — Backend Access"
COM_MURUGUARD_HARDENING_DESC="Adds a web server password prompt in front of /administrator, blocking brute-force login attempts before Joomla even loads. Automatically verified with a real test request and rolled back if anything looks wrong -- it never activates unverified."
COM_MURUGUARD_HARDENING_ACTIVE_LABEL="Backend access protection is active"
COM_MURUGUARD_HARDENING_ACTIVE_DETAIL="Username: %s · Activated: %s"
COM_MURUGUARD_HARDENING_DEACTIVATE_CONFIRM="Remove the backend access password prompt? This also turns off Emergency Mode if it's active."
COM_MURUGUARD_HARDENING_DEACTIVATE_BTN="Deactivate"
COM_MURUGUARD_HARDENING_WRITABLE_WARNING="Works on any web server (Apache, Nginx, LiteSpeed) as long as the MuRu Guard Shield plugin is installed and enabled -- it enforces this at the PHP layer, in addition to a .htaccess block for servers that read one. Requires PHP write access to the administrator/ folder. Use different credentials than your Joomla login -- that's the point of the extra layer."
COM_MURUGUARD_HARDENING_ACTIVATE_CONFIRM="Activate the backend password prompt? Make sure you've saved the username and password shown below somewhere safe first -- they will not be shown again."
COM_MURUGUARD_HARDENING_USERNAME_LABEL="User name"
COM_MURUGUARD_HARDENING_PASSWORD_LABEL="Password (at least 8 characters)"
COM_MURUGUARD_HARDENING_PASSWORD_REPEAT_LABEL="Repeat password"
COM_MURUGUARD_HARDENING_GENERATE_BTN="Generate securely"
COM_MURUGUARD_HARDENING_GENERATE_HINT="Creates a strong 20-character random password and fills both fields -- save it somewhere before activating."
COM_MURUGUARD_HARDENING_TIP="This is checked with a real request using the exact credentials above before it's treated as active -- if that check fails for any reason, nothing is left changed."
COM_MURUGUARD_HARDENING_ACTIVATE_BTN="Activate protection now"
