COM_MURUGUARD_EMERGENCY_TITLE="Emergency Mode — Lock the Entire Site"
COM_MURUGUARD_EMERGENCY_DESC="Extends the same password prompt to the whole site -- ideal for cleaning up after a compromise or during a staging phase. While active, every visitor sees the password prompt, and Joomla updates and automatic calls (cron/webhooks/payment callbacks) are blocked too."
COM_MURUGUARD_EMERGENCY_NEEDS_BACKEND_MSG="Set up backend access protection above first -- Emergency Mode reuses those same credentials."
