COM_MURUGUARD_SHIELD_BLOCK_BRUTEFORCE_LABEL="Block brute-force login attempts"
COM_MURUGUARD_SHIELD_BLOCK_BRUTEFORCE_DESC="Reject further backend login attempts from an IP once it crosses the threshold below. Every failure is logged regardless of this setting."
